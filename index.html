<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Friend or Pest Game</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      background: 
                  url('Images/bg/bground.JPG') no-repeat center center fixed;
      background-size: cover;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    h1 {
      background-color: #00796b;
      color: white;
      padding: 20px 0;
      margin: 0;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 10;
    }
    .hidden { display: none; }
    .game-container {
      margin: 30px auto;
      max-width: 600px;
      background-color: rgba(255, 255, 255, 0.9); /* glass effect */
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(6px);
      position: relative;
      z-index: 10;
    }
    .insect-img {
      max-width: 100%;
      border: 6px solid #00796b;
      border-radius: 15px;
      margin-top: 10px;
      opacity: 0;
      transform: scale(0.95);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .insect-img.show {
      opacity: 1;
      transform: scale(1);
    }
    .buttons {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    button {
      padding: 15px 30px;
      font-size: 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .friend { background-color: #4CAF50; color: white; }
    .friend:hover { background-color: #388e3c; }
    .pest { background-color: #f44336; color: white; }
    .pest:hover { background-color: #d32f2f; }
    #score, #lives, #progress {
      font-size: 22px;
      margin: 10px;
      color: #333;
      position: relative;
      z-index: 10;
    }
    #lives { color: #e53935; }
    #insect-name {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
      color: #00695c;
    }
    #feedback {
      font-size: 18px;
      margin-top: 20px;
      padding: 10px;
      background-color: #eeeeee;
      border-radius: 10px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    #feedback.correct { color: green; font-weight: bold; }
    #feedback.wrong {
      color: red;
      font-weight: bold;
      animation: shake 0.4s;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
      100% { transform: translateX(0); }
    }
    #start-screen, #end-screen { margin-top: 60px; }
    #start-screen button, #end-screen button {
      background-color: #00796b;
      color: white;
      padding: 15px 30px;
      font-size: 22px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin: 10px;
    }
    #start-screen button:hover, #end-screen button:hover { background-color: #004d40; }
    #final-score {
      font-size: 26px;
      margin-bottom: 20px;
      color: #444;
    }
    #next-btn {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 18px;
      background-color: #0288d1;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    #next-btn:hover { background-color: #0277bd; }

    /* Floating insects */
    .insects {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1; /* behind game UI */
    }
    .insect {
      position: absolute;
      font-size: 2rem;
      opacity: 0.9;
    }
    @keyframes float1 {
      0% { transform: translate(-50px, 0) rotate(0); }
      50% { transform: translate(50vw, -40px) rotate(20deg); }
      100% { transform: translate(110vw, 0) rotate(-20deg); }
    }
    @keyframes float2 {
      0% { transform: translate(100vw, 0) rotate(0); }
      50% { transform: translate(50vw, 40px) rotate(-20deg); }
      100% { transform: translate(-60vw, 0) rotate(20deg); }
    }
  </style>
</head>
<body>
 <h1>Friend or Pest?</h1>

  <!-- Floating insects layer -->
  <div class="insects">
    <div class="insect" style="top:10%; animation: float1 18s linear infinite;">🐞</div>
    <div class="insect" style="top:20%; animation: float2 25s linear infinite;">🦋</div>
    <div class="insect" style="top:70%; animation: float1 22s linear infinite;">🐝</div>
    <div class="insect" style="top:50%; animation: float2 20s linear infinite;">🐞</div>
    <div class="insect" style="top:30%; animation: float1 30s linear infinite;">🦋</div>
    <div class="insect" style="top:80%; animation: float2 26s linear infinite;">🐝</div>
  </div>

  <div id="start-screen">
    <div style="margin-bottom: 20px; font-size: 25px; color: #333; padding: 0 20px;">
      Welcome to <strong>Friend or Pest?</strong> 🐞<br><br><br><br><br><br>
      Choose a difficulty level:<br><br>
    </div>
    <button onclick="startGame('easy')">Easy <br> (7 ❤️ - 10 Questions)</button>
    <button onclick="startGame('medium')">Medium <br> (5 ❤️ - 20 Questions)</button>
    <button onclick="startGame('hard')">Hard <br> (3 ❤️ - 30 Questions)</button>
  </div>

  <div id="game" class="hidden">
    <div id="score">Score: 0</div>
    <div id="lives"></div>
    <div id="progress"></div>
    <div class="game-container">
      <h2 id="insect-name"></h2>
      <img id="insect" class="insect-img" src="" alt="Insect" />
      <div class="buttons">
        <button class="friend" onclick="choose('friend')">Friend</button>
        <button class="pest" onclick="choose('pest')">Pest</button>
      </div>
      <div id="feedback"></div>
      <button id="next-btn" class="hidden" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <div id="end-screen" class="hidden">
    <h2 id="final-score"></h2>
    <button onclick="showMenu()">Back to Menu</button>
  </div>

  <audio id="correct-sound" src="audio/Correct.mp3"></audio>
  <audio id="wrong-sound" src="audio/Wrong.mp3"></audio>

<script>
  // Your insects array (unchanged, keep your original full list)
  const insectsOriginal = [

        img: 'Images/pests/Brown-Planthopper.jpg',
        name: 'Brown Planthopper',
        type: 'pest',
        description: 'Brown Planthopper sucks rice sap and spreads viral diseases, causing hopper burn.'
      },
      {
        img: 'Images/pests/Armyworm.jpg',
        name: 'Army Worm',
        type: 'pest',
        description: 'Army Worm cuts young rice seedlings at the base, killing plants.'
      },
      {
        img: 'Images/pests/IAS.jpg',
        name: 'Invasive Apple Snail',
        type: 'pest',
        description: 'Invasive Apple Snail feeds on young rice seedlings, damaging new paddies.'
      },
      {
        img: 'Images/pests/Greenleafhopper.jpg',
        name: 'Green Leafhopper',
        type: 'pest',
        description: 'Green Leafhopper spreads plant viruses while feeding on rice sap.'
      },
      {
        img: 'Images/pests/leaffolder.jpg',
        name: 'Leaf Folder',
        type: 'pest',
        description: 'Leaf Folder folds and feeds inside rice leaves, reducing photosynthesis.'
      },
       {
        img: 'Images/pests/Molecricket.jpg',
        name: 'Mole Cricket',
        type: 'pest',
        description: 'Mole Cricket damages roots by tunneling and cutting seedlings.'
      },
       {
        img: 'Images/pests/Rat.jpg',
        name: 'Rats',
        type: 'pest',
        description: 'Rats feed on rice seeds, stems, and grains from planting to harvest.'
      },
       {
        img: 'Images/pests/RBB.jpg',
        name: 'Rice Black Bug',
        type: 'pest',
        description: 'Rice black bugs stay at the plant base, sucking sap and causing deadhearts, whiteheads, or bug burn during severe infestations.'
      },
      {
        img: 'Images/pests/Ricestemborer.jpg',
        name: 'Rice Stemborer',
        type: 'pest',
        description: 'Rice Stemborer bores into stems, causing dead hearts and white heads.'
      },
      {
        img: 'Images/pests/Ricebug.jpg',
        name: 'Ricebug',
        type: 'pest',
        description: 'Ricebug pierces rice grains and sucks the soft sap, causing the grains to become discolored or empty.'
      },
      {
        img: 'Images/pests/Skipper.jpg',
        name: 'Skipper',
        type: 'pest',
        description: 'Skipper feeds on rice leaves, reducing yield.'
      },
      {
        img: 'Images/pests/Weevil.jpg',
        name: 'Weevil',
        type: 'pest',
        description: 'Weevil infests stored grains, lowering quality and quantity.'
      },
      {
        img: 'Images/pests/WBP.jpg',
        name: 'White-backed Planthopper',
        type: 'pest',
        description: 'White-backed Planthopper feeds on sap and spreads viruses, weakening plants.'
      },
      {
        img: 'Images/pests/yellowstemborer.jpg',
        name: 'Yellow Stemborer',
        type: 'pest',
        description: 'Yellow Stemborer bores and feed in the stem, causing deadheart during vegetative Phase ang white heads during maturity phase of rice.'
      }, 
       {
        img: 'Images/friend/Bigwasp.jpg',
        name: 'Big Wasp',
        type: 'friend',
        description: 'Big wasps feed on the larvae and pupae of leaffolders, skippers, armyworms, whorl maggots, and stemborers.'
      },
      {
        img: 'Images/friend/Damselfly.jpg',
        name: 'Damselfly',
        type: 'friend',
        description: 'Damselflies eat harmful mosquitoes and insects.'
      },
      {
        img: 'Images/friend/DwarfSpider.jpg',
        name: 'Dwarf Spider',
        type: 'friend',
        description: 'Dwarf spiders feed on planthopper and leafhopper nymphs, whorl maggots'
      },
      {
        img: 'Images/friend/Fieldcricket.jpg',
        name: 'Field crickets',
        type: 'friend',
        description: 'Field crickets help break down organic matter.'
      },
      {
        img: 'Images/friend/GroundBettle.jpg',
        name: 'Ground Beetle',
        type: 'friend',
        description: 'Ground beetles feed on nymps of BPH, GLH and larvae of stemborers and leaf folders.'
      },
      {
        img: 'Images/friend/LadyBettle.jpg',
        name: 'Lady Beetle',
        type: 'friend',
        description: 'Lady beetles eat aphids that damage crops.'
      },
        {
        img: 'Images/friend/Ladybug Nymph.jpg',
        name: 'Ladybug Nymph',
        type: 'friend',
        description: 'Ladybug eats nymph of Brown Plant Hopper and small larvae of pests.'
      },
      {
        img: 'Images/friend/LonghornedGrasshopper.jpg',
        name: 'Long-horned Grasshopper',
        type: 'friend',
        description: 'Long-horned grasshoppers feed on stemborer egg masses, including hairy ones, as well as eggs of leaffeeders, rice bugs, and nymphs of planthoppers and leafhoppers.'
      },
      {
        img: 'Images/friend/LongjawedSpider.jpg',
        name: 'Long-jawed Spider',
        type: 'friend',
        description: 'Long-jawed spiders feeds on adult and nymps of BPH, GLH, Whorll maggots, that trapped in its web'
      },
      {
        img: 'Images/friend/LynxSpider.jpg',
        name: 'Lynx Spider',
        type: 'friend',
        description: 'Lynx Spiders feed on planthoppers, leafhoppers, caseworms, leaffolders, stem borer moths, rice seed bugs, and whorl maggots.'
      },
       {
        img: 'Images/friend/MiridBug.jpg',
        name: 'Mirid Bug',
        type: 'friend',
        description: 'Mirid bugs prefer the eggs of brown planthoppers and striped stem borers, and also feed on young planthopper and leafhopper nymphs.'
      },
      {
        img: 'Images/friend/Orbspider.jpg',
        name: 'Orb Spider',
        type: 'friend',
        description: 'Orb spiders catch flying pests in webs.'
      },
      {
        img: 'Images/friend/ShorthornedGrasshopper.jpg',
        name: 'Short-horned Grasshopper',
        type: 'pest',
        description: 'Short-horned grasshoppers feeds on leaves and cut panicle branches.'
      },
      {
        img: 'Images/friend/Smallwasp.jpg',
        name: 'Small Wasp',
        type: 'friend',
        description: 'Small wasps parasitized eggmass and larvae of pests.'
      },
      {
        img: 'Images/friend/TachinidFly.jpg',
        name: 'Tachinid Fly',
        type: 'friend',
        description: 'Tachinid fly feeds on larvae of leaffolders, skippers, armyworms, and stem borers.'
      },
      {
        img: 'Images/friend/Wolfspider.jpg',
        name: 'Wolf Spider',
        type: 'friend',
        description: 'Wolf spiders hunt and control harmful bugs.'
      },
  ];

  let insects = [];
  let currentIndex = 0;
  let score = 0;
  let lives = 5;
  let totalQuestions = 0;

  const insectImg = document.getElementById('insect');
  const insectNameDisplay = document.getElementById('insect-name');
  const scoreDisplay = document.getElementById('score');
  const livesDisplay = document.getElementById('lives');
  const progressDisplay = document.getElementById('progress');
  const feedbackDisplay = document.getElementById('feedback');
  const startScreen = document.getElementById('start-screen');
  const gameScreen = document.getElementById('game');
  const endScreen = document.getElementById('end-screen');
  const finalScore = document.getElementById('final-score');
  const correctSound = document.getElementById('correct-sound');
  const wrongSound = document.getElementById('wrong-sound');
  const nextBtn = document.getElementById('next-btn');

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function setChoiceButtonsEnabled(enabled) {
    document.querySelectorAll('.buttons button').forEach(btn => btn.disabled = !enabled);
  }

  function updateLivesDisplay() {
    livesDisplay.textContent = 'Lives: ' + '❤️'.repeat(lives);
  }

  function showInsect() {
    const insect = insects[currentIndex];
    insectImg.classList.remove('show'); // reset animation
    insectImg.src = insect.img;
    insectImg.alt = insect.name + " - " + insect.type;
    setTimeout(() => insectImg.classList.add('show'), 50);

    insectNameDisplay.textContent = insect.name || '';
    feedbackDisplay.textContent = '';
    feedbackDisplay.className = '';
    progressDisplay.textContent = `Insect ${currentIndex + 1} of ${totalQuestions}`;
    nextBtn.classList.add('hidden');
    setChoiceButtonsEnabled(true);
  }

  function choose(choice) {
    const insect = insects[currentIndex];
    setChoiceButtonsEnabled(false);

    if (insect.type === choice) {
      score++;
      correctSound.play();
      feedbackDisplay.innerHTML = '✅ Correct!<br><br>' + insect.description;
      feedbackDisplay.className = 'correct';
    } else {
      lives--;
      updateLivesDisplay();
      wrongSound.play();
      feedbackDisplay.innerHTML = '❌ Wrong!<br><br>' + insect.description;
      feedbackDisplay.className = 'wrong';
      if (lives <= 0) {
        endGame();
        return;
      }
    }

    scoreDisplay.textContent = 'Score: ' + score;
    nextBtn.classList.remove('hidden');
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex >= totalQuestions) {
      endGame();
      return;
    }
    showInsect();
  }

  function startGame(difficulty) {
    insects = [...insectsOriginal];
    shuffle(insects);

    if (difficulty === 'easy') { lives = 7; totalQuestions = 10; }
    else if (difficulty === 'medium') { lives = 5; totalQuestions = 20; }
    else if (difficulty === 'hard') { lives = 3; totalQuestions = 30; }

    insects = insects.slice(0, totalQuestions);

    currentIndex = 0;
    score = 0;

    scoreDisplay.textContent = 'Score: 0';
    updateLivesDisplay();
    feedbackDisplay.textContent = '';
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    showInsect();
  }

  function endGame() {
    gameScreen.classList.add('hidden');
    endScreen.classList.remove('hidden');
    finalScore.innerHTML = `🎯 Final Score: ${score} / ${totalQuestions}`;
  }

  function showMenu() {
    startScreen.classList.remove('hidden');
    gameScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
  }

  document.addEventListener('keydown', function(e) {
    if (!gameScreen.classList.contains('hidden') && nextBtn.classList.contains('hidden')) {
      if (e.key.toLowerCase() === 'f') choose('friend');
      else if (e.key.toLowerCase() === 'p') choose('pest');
    }
  });
</script>
</body>
</html>
